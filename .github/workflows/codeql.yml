name: CodeQL

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@adfda868f108ac4222129de456ea554034a27db7
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@adfda868f108ac4222129de456ea554034a27db7
        with:
          category: /language:javascript-typescript
