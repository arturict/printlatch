name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: github/codeql-action/init@adfda868f108ac4222129de456ea554034a27db7
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@adfda868f108ac4222129de456ea554034a27db7
        with:
          category: /language:javascript-typescript

