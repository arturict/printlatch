name: CodeQL

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@3ea37a44b6e4e6847c46edae209410d258d548d1
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@3ea37a44b6e4e6847c46edae209410d258d548d1
        with:
          category: /language:javascript-typescript
