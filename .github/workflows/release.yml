name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.94.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      - name: Verify version and stage release
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($tag -ne "v$version") {
            throw "Tag $tag does not match Cargo version $version"
          }
          $releaseNotes = "docs/releases/$tag.md"
          if (-not (Test-Path -LiteralPath $releaseNotes -PathType Leaf)) {
            throw "Missing release notes: $releaseNotes"
          }
          $stage = "artifacts/printlatch-$tag-windows-x64"
          New-Item -ItemType Directory -Force "$stage/docs/assets", "$stage/examples", "$stage/packages/sdk/dist" | Out-Null
          Copy-Item target/release/printlatch.exe "$stage/printlatch.exe"
          Copy-Item scripts/install.ps1 "$stage/install.ps1"
          Copy-Item scripts/uninstall.ps1 "$stage/uninstall.ps1"
          Copy-Item scripts/smoke-release.ps1 "$stage/smoke-release.ps1"
          Copy-Item docs/assets/sample.pdf "$stage/docs/assets/sample.pdf"
          Copy-Item examples/*.js, examples/*.mjs "$stage/examples/"
          Copy-Item packages/sdk/dist/* "$stage/packages/sdk/dist/"
          Copy-Item packages/sdk/package.json, packages/sdk/README.md "$stage/packages/sdk/"
          Copy-Item README.md, LICENSE, NOTICE, SECURITY.md "$stage/"
          Copy-Item target/release/printlatch.exe "artifacts/printlatch-$tag-windows-x64.exe"
          Compress-Archive -Path "$stage/*" -DestinationPath "artifacts/printlatch-$tag-windows-x64.zip"
          $files = @(
            "artifacts/printlatch-$tag-windows-x64.exe",
            "artifacts/printlatch-$tag-windows-x64.zip"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content artifacts/SHA256SUMS.txt
          "STAGE=$stage" >> $env:GITHUB_ENV
          "RELEASE_NOTES=$releaseNotes" >> $env:GITHUB_ENV
      - name: Smoke release archive
        shell: pwsh
        run: ./scripts/smoke-release.ps1 -ArchiveRoot $env:STAGE
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: |
            artifacts/printlatch-${{ github.ref_name }}-windows-x64.exe
            artifacts/printlatch-${{ github.ref_name }}-windows-x64.zip
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          body_path: ${{ env.RELEASE_NOTES }}
          fail_on_unmatched_files: true
          files: |
            artifacts/printlatch-${{ github.ref_name }}-windows-x64.exe
            artifacts/printlatch-${{ github.ref_name }}-windows-x64.zip
            artifacts/SHA256SUMS.txt
