[package]
name = "printlatch"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A local-first, explicitly paired PDF print agent for Windows"
license = "Apache-2.0"
repository = "https://github.com/arturict/printlatch"
homepage = "https://printlatch.vercel.app"
keywords = ["printing", "pdf", "localhost", "windows", "security"]
categories = ["command-line-utilities", "web-programming::http-server"]

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.9", features = ["json", "macros", "multipart"] }
base64 = "0.23.0"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive", "env"] }
flate2 = "1.1.5"
getrandom = "0.3.4"
hex = "0.4.3"
http = "1.3.1"
lopdf = { version = "0.44.0", default-features = false }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = "0.5.2"
tower-http = { version = "0.7.0", features = ["catch-panic", "limit", "request-id", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[target.'cfg(windows)'.dependencies]
winprint = "0.2.1"

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.23.0"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -2 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
assigning_clones = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
needless_raw_string_hashes = "allow"
unnecessary_wraps = "allow"
